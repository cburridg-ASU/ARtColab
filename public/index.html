<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2e9">
    <meta name="description" content="A playful AR party game. Make something together.">
    <title>ARtColab — Play in your space</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <nav class="navigation" aria-label="Main navigation">
        <a class="wordmark" href="/" aria-label="ARtColab home">ARt<span>Colab</span></a>

      </nav>

      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <div class="player-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <h1 id="hero-title">Make your<br>space <span>play.</span></h1>
          <p class="intro">Grab your phone. Make something together.</p>
          <a class="primary-button" href="/host">Start a game <span aria-hidden="true">→</span></a>
          <a class="text-link" href="/join">Have a room code? Join a game</a>
        </div>
      </section>

      <footer>
        <span>One screen. All your friends.</span>
        <span>© <span id="year">2026</span> ARtColab</span>
      </footer>
    </main>
